name: Wanderlog Alt CI/CD

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master, develop]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type to produce'
        required: true
        default: 'both'
        type: choice
        options:
          - debug
          - release
          - both

env:
  JAVA_VERSION: '17'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  analyze:
    name: Analyze Code
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v30

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - name: Install devenv
        run: |
          nix profile remove devenv 2>/dev/null || true
          nix profile install --accept-flake-config github:cachix/devenv/latest

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Setup .env
        run: |
          echo "MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN }}" > .env

      - name: Get dependencies
        run: devenv shell -- flutter pub get

      - name: Generate code
        run: |
          devenv shell -- flutter pub run build_runner build --delete-conflicting-outputs
          devenv shell -- flutter gen-l10n

      - name: Analyze code
        run: devenv shell -- flutter analyze --no-fatal-infos --no-fatal-warnings

  test:
    name: Run Tests
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v30

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - name: Install devenv
        run: |
          nix profile remove devenv 2>/dev/null || true
          nix profile install --accept-flake-config github:cachix/devenv/latest

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Setup .env
        run: |
          echo "MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN }}" > .env

      - name: Get dependencies
        run: devenv shell -- flutter pub get

      - name: Generate code
        run: |
          devenv shell -- flutter pub run build_runner build --delete-conflicting-outputs
          devenv shell -- flutter gen-l10n

      - name: Run tests
        run: devenv shell -- flutter test

  build-debug:
    name: Build Debug APK
    runs-on: self-hosted
    timeout-minutes: 30
    if: |
      (github.event_name != 'workflow_dispatch' &&
       !startsWith(github.ref, 'refs/tags/v') &&
       github.ref != 'refs/heads/master') ||
      github.event.inputs.build_type == 'debug' ||
      github.event.inputs.build_type == 'both'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Determine build metadata
        id: build_meta
        run: |
          BUILD_NUMBER=$(( ${{ github.run_number }} * 100 + ${{ github.run_attempt }} ))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Install Nix
        uses: cachix/install-nix-action@v30

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - name: Install devenv
        run: |
          nix profile remove devenv 2>/dev/null || true
          nix profile install --accept-flake-config github:cachix/devenv/latest

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup .env
        run: |
          echo "MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN }}" > .env

      - name: Get dependencies
        run: devenv shell -- flutter pub get

      - name: Generate code
        run: |
          devenv shell -- flutter pub run build_runner build --delete-conflicting-outputs
          devenv shell -- flutter gen-l10n

      - name: Build Debug APK
        run: |
          devenv shell -- flutter build apk --debug --no-pub \
            --target-platform android-arm64 \
            --build-number ${{ steps.build_meta.outputs.BUILD_NUMBER }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: wanderlog-alt-debug-b${{ steps.build_meta.outputs.BUILD_NUMBER }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  build-release:
    name: Build Release
    runs-on: self-hosted
    timeout-minutes: 30
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both')) ||
      startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Determine build metadata
        id: build_meta
        run: |
          BUILD_NUMBER=$(( ${{ github.run_number }} * 100 + ${{ github.run_attempt }} ))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Install Nix
        uses: cachix/install-nix-action@v30

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - name: Install devenv
        run: |
          nix profile remove devenv 2>/dev/null || true
          nix profile install --accept-flake-config github:cachix/devenv/latest

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup .env
        run: |
          echo "MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN }}" > .env

      - name: Get dependencies
        run: devenv shell -- flutter pub get

      - name: Generate code
        run: |
          devenv shell -- flutter pub run build_runner build --delete-conflicting-outputs
          devenv shell -- flutter gen-l10n

      - name: Decrypt keystore
        run: |
          pushd android
          ./scripts/decrypt-key.sh "upload.jks.enc" "upload.jks"
          ./scripts/setup-keystore.sh
        env:
          DECRYPTION_KEY: ${{ secrets.DECRYPTION_KEY }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Set version
        run: |
          sed -i -E "s/version: (.*?)\+(.*?)/version: \1+${{ steps.build_meta.outputs.BUILD_NUMBER }}/g" pubspec.yaml

      - name: Build Release App Bundle
        run: |
          devenv shell -- flutter build appbundle --release --no-pub \
            --build-number ${{ steps.build_meta.outputs.BUILD_NUMBER }}

      - name: Upload Release App Bundle
        uses: actions/upload-artifact@v7
        with:
          name: wanderlog-alt-release-b${{ steps.build_meta.outputs.BUILD_NUMBER }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Deploy to Google Play
        if: github.ref == 'refs/heads/master'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: it.denv.wanderlog_alt
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: draft

      - name: Determine release version
        id: release_version
        run: |
          SEMVER=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1 | tr -d ' ')
          RELEASE_TAG="v${SEMVER}-${{ steps.build_meta.outputs.BUILD_NUMBER }}"
          echo "SEMVER=$SEMVER" >> $GITHUB_OUTPUT
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_version.outputs.RELEASE_TAG }}
          name: Wanderlog Alt ${{ steps.release_version.outputs.RELEASE_TAG }}
          draft: false
          prerelease: false
          generate_release_notes: false
          files: build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-web:
    name: Build Web
    runs-on: self-hosted
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v30

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - name: Install devenv
        run: |
          nix profile remove devenv 2>/dev/null || true
          nix profile install --accept-flake-config github:cachix/devenv/latest

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Setup .env
        run: |
          echo "MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN }}" > .env

      - name: Get dependencies
        run: devenv shell -- flutter pub get

      - name: Generate code
        run: |
          devenv shell -- flutter pub run build_runner build --delete-conflicting-outputs
          devenv shell -- flutter gen-l10n

      - name: Build Web
        run: devenv shell -- flutter build web --release --base-href '/'

      - name: Upload Web Build
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: build/web
          retention-days: 1

  deploy-web:
    name: Deploy to GitHub Pages
    needs: build-web
    runs-on: self-hosted
    if: github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Web Build
        uses: actions/download-artifact@v8
        with:
          name: web-build
          path: build/web

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
